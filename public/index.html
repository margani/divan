<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>دیوان</title>
    <meta name="description" content="دیوان، خوانشگری آرام و زیبا برای شعر فارسی بر پایهٔ داده‌های گنجور." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <a class="skip" href="#app">رفتن به متن</a>

        <button type="button" class="icon-btn" id="theme-btn"></button>

    <footer class="site">
      <p>
        دیوان خوانشگری برای داده‌های

      </p>
      <p class="version" id="version"></p>
    </footer>
